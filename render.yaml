services:
  - type: web
    name: ai-interview-backend
    env: python
    region: oregon

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: "false"

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true
