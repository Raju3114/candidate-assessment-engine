services:
  # FastAPI Web Application Service
  - type: web
    name: ai-interview-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-interview-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

# PostgreSQL Managed Database
databases:
  - name: ai-interview-postgres
    databaseName: ai_interview_db
    user: postgres
    plan: starter
    region: oregon

# Redis Managed Datastore
services:
  - type: redis
    name: ai-interview-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
